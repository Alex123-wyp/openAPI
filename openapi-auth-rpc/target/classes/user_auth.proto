syntax = "proto3";

// Generate one Java class per message/service instead of nesting everything
// under a single outer class. This makes the generated code easier to use.
option java_multiple_files = true;
// All generated Java types will live in this package.
option java_package = "com.yupeng.openapi.auth.rpc";
option java_outer_classname = "UserAuthProto";

package userauth;

// This gRPC service is called by the gateway.
// The gateway only knows an accessKey from the incoming request headers,
// so it asks the backend to translate that accessKey into the real auth data
// stored in the user table.
service UserAuthService {
  rpc GetUserAuthByAccessKey (GetUserAuthByAccessKeyRequest) returns (GetUserAuthByAccessKeyResponse);
}

// This gRPC service lets the gateway manage invoke quota before and after it
// forwards a public interface request.
service InterfaceQuotaService {
  // Reserve one available invocation slot before the request is forwarded.
  rpc ReserveInvokeQuota (ReserveInvokeQuotaRequest) returns (ReserveInvokeQuotaResponse);
  // Mark a reserved invocation as successfully consumed after a 2xx response.
  rpc CommitInvokeQuota (CommitInvokeQuotaRequest) returns (CommitInvokeQuotaResponse);
  // Give the reserved slot back if the downstream invocation fails.
  rpc RollbackInvokeQuota (RollbackInvokeQuotaRequest) returns (RollbackInvokeQuotaResponse);
}

// The gateway sends the caller's accessKey as the lookup key.
message GetUserAuthByAccessKeyRequest {
  string access_key = 1;
}

// The backend returns the minimum data the gateway needs to finish auth:
// 1. whether the user exists
// 2. which user matched
// 3. the secretKey used to recompute the request signature
// 4. whether the matched user is allowed to invoke APIs
message GetUserAuthByAccessKeyResponse {
  bool found = 1;
  int64 user_id = 2;
  string access_key = 3;
  string secret_key = 4;
  bool active = 5;
}

// The gateway identifies the caller by user_id and the target API by
// request path + HTTP method.
message ReserveInvokeQuotaRequest {
  int64 user_id = 1;
  string request_path = 2;
  string request_method = 3;
}

// allowed=false means the caller has no remaining quota or the interface row
// cannot be resolved. interface_info_id is returned so the gateway can later
// commit or roll back the same reserved invocation.
message ReserveInvokeQuotaResponse {
  bool allowed = 1;
  int64 interface_info_id = 2;
}

message CommitInvokeQuotaRequest {
  int64 user_id = 1;
  int64 interface_info_id = 2;
}

message CommitInvokeQuotaResponse {
  bool success = 1;
}

message RollbackInvokeQuotaRequest {
  int64 user_id = 1;
  int64 interface_info_id = 2;
}

message RollbackInvokeQuotaResponse {
  bool success = 1;
}
